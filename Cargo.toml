[package]
name = "codex-blogger"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Article package helpers for Codex Blogger Plugin"
license = "MIT"

[dependencies]
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
percent-encoding = "2.3.2"
regex = "1.12.3"
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3.27.0"
